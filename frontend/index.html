<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta
			name="description"
			content="Chords and lyrics for worship teams — search, transpose, build set lists and play them on stage."
		/>
		<meta name="theme-color" content="#f6f4f0" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1a1918" media="(prefers-color-scheme: dark)" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<title>russchords</title>
		<!-- Apply the saved color scheme before first paint (no light/dark flash).
		     The key must match `colorSchemeManager` in src/theme/index.ts. -->
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('russchords-color-scheme');
					var scheme =
						stored === 'dark' || stored === 'light'
							? stored
							: window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light';
					document.documentElement.setAttribute('data-mantine-color-scheme', scheme);
				} catch (e) {}
			})();
		</script>
		<style>
			/* Matches --app-bg so the page never flashes white while JS loads. */
			html[data-mantine-color-scheme='light'] body {
				background: #f6f4f0;
			}
			html[data-mantine-color-scheme='dark'] body {
				background: #1a1918;
			}
		</style>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
